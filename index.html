<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>KaniKai</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #fff;
      --text: #111827;
      --muted: #6b7280;
      --border: #dbe1ea;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #b91c1c;
      --success: #047857;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --card: #151b2d;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #30384d;
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
        --danger: #f87171;
        --success: #34d399;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 18px 60px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }
    .header-copy { min-width: 0; }
    h1 { margin: 0 0 4px; font-size: clamp(1.7rem, 4vw, 2.35rem); }
    h2 { margin: 0; font-size: 1.25rem; }
    .subtitle { color: var(--muted); margin: 0; }
    .lang-switch {
      display: inline-flex;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      background: var(--card);
    }
    .lang-switch button {
      border: 0;
      border-radius: 0;
      padding: 7px 11px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: .88rem;
    }
    .lang-switch button:hover { background: rgba(127,127,127,.08); }
    .lang-switch button[aria-pressed="true"] {
      background: var(--accent);
      color: white;
    }
    .lang-switch button[aria-pressed="true"]:hover { background: var(--accent-hover); }
    .mode-field { margin-bottom: 12px; }
    .mode-switch {
      display: inline-flex;
      flex-wrap: wrap;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      background: var(--card);
    }
    .mode-switch button {
      border: 0;
      border-radius: 0;
      padding: 8px 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: .88rem;
    }
    .mode-switch button:hover { background: rgba(127,127,127,.08); }
    .mode-switch button[aria-pressed="true"] {
      background: var(--accent);
      color: white;
    }
    .mode-switch button[aria-pressed="true"]:hover { background: var(--accent-hover); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin: 12px 0;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }
    .token-panel {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(127,127,127,.06);
    }
    .token-compact {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .token-compact .help { margin: 2px 0 0; }
    #tokenCard.collapsed {
      padding: 10px 12px;
    }
    #tokenCard.collapsed .token-compact { display: flex; }
    #tokenCard.collapsed .token-body { display: none; }
    label { display: block; font-weight: 650; margin-bottom: 7px; }
    .label-with-help {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    input, select, button, textarea {
      font: inherit;
    }
    input[type="password"], input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      color: var(--text);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 14px; align-items: end; }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding-bottom: 2px;
    }
    .checkbox-field input { width: auto; margin: 0; }
    .checkbox-field label { margin: 0; font-weight: 550; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      font-weight: 650;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: rgba(127,127,127,.08); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.help-tip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      line-height: 1;
      cursor: help;
      flex-shrink: 0;
    }
    button.help-tip:hover,
    button.help-tip:focus-visible {
      background: rgba(127,127,127,.1);
      color: var(--text);
    }
    button.help-tip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .help-tooltip {
      position: absolute;
      left: 0;
      top: calc(100% + 6px);
      z-index: 5;
      width: min(260px, 70vw);
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--muted);
      font-size: .82rem;
      font-weight: 450;
      line-height: 1.4;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity .12s ease, visibility .12s ease;
    }
    .label-with-help:hover .help-tooltip,
    .label-with-help:focus-within .help-tooltip,
    button.help-tip[aria-expanded="true"] + .help-tooltip {
      opacity: 1;
      visibility: visible;
    }
    .help, .status { color: var(--muted); font-size: .92rem; }
    .status { margin-top: 12px; min-height: 1.4em; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    #wordsStatus, #practiceStatus { margin-top: 10px; }
    #wordsStatus:empty, #practiceStatus:empty { display: none; }
    .summary { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px; }
    .word-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .word {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 11px;
      min-width: 0;
    }
    .japanese { font-size: 1.2rem; font-weight: 700; line-height: 1.25; word-break: break-word; }
    .reading { color: var(--muted); font-size: .85rem; word-break: break-word; }
    .meaning { font-weight: 550; font-size: .92rem; line-height: 1.3; word-break: break-word; }
    .learned { color: var(--muted); font-size: .78rem; margin-top: 4px; }
    textarea {
      width: 100%;
      min-height: 250px;
      resize: vertical;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
    }
    #csvPaste {
      min-height: 140px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .88rem;
      background: var(--card);
    }
    .source-panel { margin-top: 14px; }
    #sourceSetupHost:empty { display: none; }
    #sourcePanelHost:empty { display: none; }
    .csv-format {
      margin: 0 0 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(127,127,127,.06);
      font-size: .9rem;
      color: var(--muted);
    }
    .csv-format code {
      display: inline-block;
      margin: 4px 0;
      white-space: pre-wrap;
    }
    .csv-format .csv-examples { margin-top: 8px; }
    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .file-picker {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .file-name {
      color: var(--muted);
      font-size: .92rem;
      min-width: 0;
      word-break: break-all;
    }
    details { margin-top: 16px; }
    summary { cursor: pointer; color: var(--muted); }
    code {
      background: rgba(127,127,127,.12);
      padding: 1px 5px;
      border-radius: 5px;
    }
    .empty { color: var(--muted); padding: 18px 0 5px; grid-column: 1 / -1; }
    @media (max-width: 900px) {
      .word-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 750px) {
      .row { grid-template-columns: 1fr 1fr; }
      .word-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 650px) {
      .row { grid-template-columns: 1fr; }
      .header { flex-wrap: wrap; }
    }
    @media (max-width: 420px) {
      .word-list { grid-template-columns: 1fr; }
      .token-compact { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<main>
  <div class="header">
    <div class="header-copy">
      <h1 data-i18n="title">KaniKai</h1>
      <p class="subtitle" data-i18n="subtitle">Turn recently learned vocabulary into words you actually use.</p>
    </div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
    </div>
  </div>

  <div id="sourceSetupHost"></div>

  <section class="card">
    <h2 data-i18n="loadTitle">Step 1: Load Words</h2>
    <div class="row">
      <div>
        <label for="source" data-i18n="dataSource">Source</label>
        <select id="source"></select>
      </div>
      <div>
        <label for="range" data-i18n="lookBack">Recency</label>
        <select id="range">
          <option value="24" data-i18n="range24">Last 24 hours</option>
          <option value="48" data-i18n="range48">Last 2 days</option>
          <option value="72" data-i18n="range72">Last 3 days</option>
          <option value="168" data-i18n="range168">Last 7 days</option>
          <option value="336" data-i18n="range336">Last 14 days</option>
        </select>
      </div>
      <div>
        <label for="limit" class="label-with-help">
          <span data-i18n="limitResults">Limit</span>
          <button
            type="button"
            class="help-tip"
            id="limitHelpTip"
            data-i18n="loadHelpAria"
            data-i18n-attr="aria-label"
            aria-label="About Limit"
            aria-describedby="limitHelp"
            aria-expanded="false"
          >?</button>
          <span id="limitHelp" role="tooltip" class="help-tooltip" data-i18n="loadHelp">Leave the limit blank to keep every match. Randomize shuffles before applying the limit.</span>
        </label>
        <input id="limit" type="number" min="1" step="1" data-i18n="limitPlaceholder" data-i18n-attr="placeholder" placeholder="All" inputmode="numeric">
      </div>
      <div class="checkbox-field">
        <input id="randomize" type="checkbox">
        <label for="randomize" data-i18n="randomize">Randomize</label>
      </div>
      <button id="load" data-i18n="loadVocabulary">Load</button>
    </div>

    <div id="sourcePanelHost"></div>

    <div id="status" class="status"></div>
  </section>

  <section id="wordsCard" class="card" hidden>
    <div class="summary">
      <h2 data-i18n="recentlyLearned">Step 2: Confirm Words</h2>
      <strong id="count"></strong>
    </div>
    <div id="words" class="word-list"></div>
    <div class="actions">
      <button id="practice" data-i18n="createPractice">Create conversation practice</button>
      <button id="copyWords" class="secondary" data-i18n="copyWordList">Copy word list</button>
    </div>
    <div id="wordsStatus" class="status" role="status" aria-live="polite"></div>
  </section>

  <section id="practiceCard" class="card" hidden>
    <div class="summary">
      <h2 data-i18n="practiceTitle">Step 3: Practice Words</h2>
    </div>
    <div class="mode-field">
      <label id="practiceModeLabel" data-i18n="practiceMode">Practice mode</label>
      <div class="mode-switch" role="group" aria-labelledby="practiceModeLabel">
        <button type="button" data-mode="speaking" data-i18n="modeSpeaking" aria-pressed="true">Speaking</button>
        <button type="button" data-mode="listening" data-i18n="modeListening" aria-pressed="false">Listening</button>
        <button type="button" data-mode="legacy" data-i18n="modeLegacy" aria-pressed="false">Legacy</button>
      </div>
    </div>
    <p class="help" id="practiceHelp">Copy this into ChatGPT. The AI waits for your questions and can suggest starter words one at a time.</p>
    <textarea id="prompt" readonly></textarea>
    <div class="actions">
      <button id="copyPrompt" data-i18n="copyPrompt">Copy prompt</button>
      <button id="openChatGPT" class="secondary" data-i18n="openChatGPT">Open ChatGPT</button>
    </div>
    <div id="practiceStatus" class="status" role="status" aria-live="polite"></div>
  </section>
</main>

<script src="translations.js"></script>
<script src="sources/core/parts-of-speech.js"></script>
<script src="sources/core/types.js"></script>
<script src="sources/core/registry.js"></script>
<script src="sources/core/loader.js"></script>
<script src="sources/core/csv.js"></script>
<script src="sources/core/source-ui.js"></script>
<script src="sources/adapters/wanikani.js"></script>
<script src="sources/adapters/csv-paste.js"></script>
<script src="sources/adapters/file-upload.js"></script>
<script>
(() => {
  "use strict";

  const LANG_KEY = "kanikai_lang";
  const SOURCE_KEY = "kanikai_source";
  const PRACTICE_MODE_KEY = "kanikai_practice_mode";
  const SUPPORTED_LANGS = ["en", "ja"];
  const PRACTICE_MODES = ["speaking", "listening", "legacy"];
  const PRACTICE_TEMPLATE_KEYS = {
    speaking: "promptTemplateSpeaking",
    listening: "promptTemplateListening",
    legacy: "promptTemplateLegacy"
  };
  const PRACTICE_HELP_KEYS = {
    speaking: "practiceHelpSpeaking",
    listening: "practiceHelpListening",
    legacy: "practiceHelpLegacy"
  };
  const STRINGS = window.KaniKaiStrings;
  const KaniKai = window.KaniKai;

  let recentWords = [];
  let currentLang = detectLang();
  let practiceMode = detectPracticeMode();

  const $ = id => document.getElementById(id);
  const status = $("status");
  const wordsStatus = $("wordsStatus");
  const practiceStatus = $("practiceStatus");
  const sourceSelect = $("source");
  const sourceUIHost = KaniKai.createSourceUIHost({
    setupHost: $("sourceSetupHost"),
    panelHost: $("sourcePanelHost")
  });

  function detectLang() {
    const saved = localStorage.getItem(LANG_KEY);
    if (SUPPORTED_LANGS.includes(saved)) return saved;
    return (navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "en";
  }

  function detectPracticeMode() {
    const saved = localStorage.getItem(PRACTICE_MODE_KEY);
    return PRACTICE_MODES.includes(saved) ? saved : "speaking";
  }

  function t(key, vars = {}) {
    const dict = STRINGS[currentLang] || STRINGS.en;
    let text = dict[key] ?? STRINGS.en[key] ?? key;
    return text.replace(/\{(\w+)\}/g, (_, name) =>
      Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : `{${name}}`
    );
  }

  function applyI18n(root = document) {
    root.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      const attr = el.getAttribute("data-i18n-attr");
      const value = t(key);
      if (attr) el.setAttribute(attr, value);
      else el.textContent = value;
    });
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang === "ja" ? "ja" : "en";
    document.title = t("title");

    const langGroup = document.querySelector(".lang-switch");
    if (langGroup) langGroup.setAttribute("aria-label", t("langGroup"));

    applyI18n(document);

    document.querySelectorAll(".lang-switch [data-lang]").forEach(btn => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-lang") === currentLang));
    });

    syncPracticeModeUI();
    updatePracticeHelp();

    populateSourceSelect();
    if (!sourceUIHost.getActive()) mountSelectedSourceUi();
    else refreshSourceUiTranslations();

    if (!$("wordsCard").hidden) renderWords();
    if (!$("practiceCard").hidden && recentWords.length) createPrompt({ scroll: false });
  }

  function syncPracticeModeUI() {
    document.querySelectorAll(".mode-switch [data-mode]").forEach(btn => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-mode") === practiceMode));
    });
  }

  function updatePracticeHelp() {
    $("practiceHelp").textContent = t(PRACTICE_HELP_KEYS[practiceMode]);
  }

  function setPracticeMode(mode) {
    if (!PRACTICE_MODES.includes(mode) || mode === practiceMode) return;
    practiceMode = mode;
    localStorage.setItem(PRACTICE_MODE_KEY, mode);
    syncPracticeModeUI();
    updatePracticeHelp();
    if (!$("practiceCard").hidden && recentWords.length) {
      createPrompt({ scroll: false });
    }
  }

  function setLang(lang) {
    if (!SUPPORTED_LANGS.includes(lang) || lang === currentLang) return;
    currentLang = lang;
    localStorage.setItem(LANG_KEY, lang);
    applyTranslations();
  }

  function setStatusOn(target, message, type = "") {
    target.textContent = message;
    target.className = "status " + type;
  }

  function setStatus(message, type = "") {
    setStatusOn(status, message, type);
  }

  function uiContext() {
    return { t, setStatus };
  }

  function populateSourceSelect() {
    const previous = sourceSelect.value || localStorage.getItem(SOURCE_KEY) || "";
    const sources = typeof KaniKai.listSources === "function" ? KaniKai.listSources() : [];
    sourceSelect.innerHTML = "";

    for (const source of sources) {
      const option = document.createElement("option");
      option.value = source.id;
      option.textContent = source.label;
      sourceSelect.appendChild(option);
    }

    if (!sources.length) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = t("noSourcesRegistered");
      sourceSelect.appendChild(option);
      return;
    }

    if (previous && sources.some(s => s.id === previous)) {
      sourceSelect.value = previous;
    }
  }

  function mountSelectedSourceUi() {
    const source = KaniKai.getSource(sourceSelect.value);
    const ui = sourceUIHost.activate(source, uiContext());
    applyI18n($("sourceSetupHost"));
    applyI18n($("sourcePanelHost"));
    if (ui && typeof ui.applyTranslations === "function") ui.applyTranslations();
  }

  function refreshSourceUiTranslations() {
    applyI18n($("sourceSetupHost"));
    applyI18n($("sourcePanelHost"));
    const ui = sourceUIHost.getActive();
    if (ui && typeof ui.applyTranslations === "function") ui.applyTranslations();
  }

  function readSharedLoadOptions() {
    const hours = Number($("range").value);
    const since = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
    const limitRaw = $("limit").value.trim();
    const limit = limitRaw === "" ? null : Math.max(1, Math.floor(Number(limitRaw)));
    const options = {
      since,
      limit: Number.isFinite(limit) ? limit : null,
      randomize: $("randomize").checked
    };

    const ui = sourceUIHost.getActive();
    if (ui && typeof ui.getLoadOptions === "function") {
      Object.assign(options, ui.getLoadOptions() || {});
    }

    return options;
  }

  function messageForLoadError(error) {
    const ui = sourceUIHost.getActive();
    if (ui && typeof ui.messageForError === "function") {
      const mapped = ui.messageForError(error);
      if (mapped) return mapped;
    }
    return error && error.message ? error.message : String(error);
  }

  function finishLoad({ words, totalMatched, randomize, limit }) {
    recentWords = words;
    renderWords();
    $("wordsCard").hidden = false;
    $("practiceCard").hidden = true;

    const ui = sourceUIHost.getActive();
    const compactStatus = Boolean(ui && typeof ui.suppressStatus === "function" && ui.suppressStatus());

    if (!words.length) {
      setStatus(compactStatus ? "" : t("noVocabulary"), "success");
      return;
    }

    if (compactStatus) {
      setStatus("");
      return;
    }

    const details = [];
    if (randomize) details.push(t("randomized"));
    if (limit != null && words.length < totalMatched) {
      details.push(t("showing", { count: words.length }));
    }

    let message;
    if (details.length) {
      message = t("foundWordsFiltered", { count: totalMatched, details: details.join(", ") });
    } else {
      message = t(totalMatched === 1 ? "foundWords" : "foundWordsPlural", { count: totalMatched });
    }
    setStatus(message, "success");
  }

  async function loadWords() {
    $("load").disabled = true;
    $("wordsCard").hidden = true;
    $("practiceCard").hidden = true;
    setStatus(t("loading"));

    try {
      const sourceId = sourceSelect.value;
      if (!sourceId) {
        setStatus(t("noSourcesRegistered"), "error");
        return;
      }

      const ui = sourceUIHost.getActive();
      if (ui && typeof ui.prepareLoad === "function" && ui.prepareLoad() === false) {
        return;
      }

      localStorage.setItem(SOURCE_KEY, sourceId);
      const options = readSharedLoadOptions();
      const result = await KaniKai.loadFromSource(sourceId, options);

      finishLoad({
        words: result.words,
        totalMatched: result.totalMatched,
        randomize: options.randomize,
        limit: options.limit
      });
    } catch (error) {
      setStatus(messageForLoadError(error), "error");
    } finally {
      $("load").disabled = false;
    }
  }

  function formatTime(iso) {
    return new Intl.DateTimeFormat(currentLang === "ja" ? "ja-JP" : "en-US", {
      dateStyle: "short",
      timeStyle: "short"
    }).format(new Date(iso));
  }

  function primaryAlternative(word) {
    return (word.alternatives && word.alternatives[0]) || "";
  }

  function renderWords() {
    setStatusOn(wordsStatus, "");
    $("count").textContent = t(
      recentWords.length === 1 ? "wordCount" : "wordCountPlural",
      { count: recentWords.length }
    );
    $("words").innerHTML = "";

    if (!recentWords.length) {
      $("words").innerHTML = `<div class="empty">${escapeHtml(t("emptyWords"))}</div>`;
      return;
    }

    for (const word of recentWords) {
      const el = document.createElement("div");
      el.className = "word";
      el.innerHTML = `
        <div>
          <div class="japanese">${escapeHtml(word.word)}</div>
          <div class="reading">${escapeHtml(primaryAlternative(word))}</div>
        </div>
        <div class="meaning">${escapeHtml((word.meanings || []).join("; "))}</div>
        <div class="learned">${escapeHtml(formatTime(word.last_seen_at))}</div>
      `;
      $("words").appendChild(el);
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[ch]));
  }

  function wordListText() {
    return recentWords.map(w => {
      const alt = primaryAlternative(w);
      const head = alt ? `${w.word}（${alt}）` : w.word;
      return `${head}— ${(w.meanings || []).join("; ")}`;
    }).join("\n");
  }

  function createPrompt({ scroll = true } = {}) {
    if (!recentWords.length) return;

    const templateKey = PRACTICE_TEMPLATE_KEYS[practiceMode] || PRACTICE_TEMPLATE_KEYS.speaking;
    $("prompt").value = t(templateKey, { list: wordListText() });
    setStatusOn(practiceStatus, "");
    updatePracticeHelp();
    syncPracticeModeUI();
    $("practiceCard").hidden = false;
    if (scroll) {
      $("practiceCard").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  async function copyText(text, successMessage, statusTarget = status) {
    try {
      await navigator.clipboard.writeText(text);
      setStatusOn(statusTarget, successMessage, "success");
    } catch {
      setStatusOn(statusTarget, t("clipboardFailed"), "error");
    }
  }

  document.querySelectorAll(".lang-switch [data-lang]").forEach(btn => {
    btn.addEventListener("click", () => setLang(btn.getAttribute("data-lang")));
  });

  sourceSelect.addEventListener("change", () => {
    if (sourceSelect.value) localStorage.setItem(SOURCE_KEY, sourceSelect.value);
    mountSelectedSourceUi();
  });
  $("load").addEventListener("click", loadWords);
  $("practice").addEventListener("click", () => createPrompt());

  document.querySelectorAll(".mode-switch [data-mode]").forEach(btn => {
    btn.addEventListener("click", () => setPracticeMode(btn.getAttribute("data-mode")));
  });

  $("copyWords").addEventListener("click", () => {
    if (recentWords.length) copyText(wordListText(), t("wordListCopied"), wordsStatus);
  });

  $("copyPrompt").addEventListener("click", () => {
    if ($("prompt").value) copyText($("prompt").value, t("promptCopied"), practiceStatus);
  });

  $("openChatGPT").addEventListener("click", () => {
    window.open("https://chatgpt.com/", "_blank", "noopener,noreferrer");
  });

  const limitHelpTip = $("limitHelpTip");
  if (limitHelpTip) {
    limitHelpTip.addEventListener("click", event => {
      event.preventDefault();
      const open = limitHelpTip.getAttribute("aria-expanded") !== "true";
      limitHelpTip.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", event => {
      if (!limitHelpTip.contains(event.target) && !$("limitHelp")?.contains(event.target)) {
        limitHelpTip.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") limitHelpTip.setAttribute("aria-expanded", "false");
    });
  }

  applyTranslations();
})();
</script>
</body>
</html>
